# ==============================================================================
# Free-detection with Real-ESRGAN stage-0 upscaling (GPU example).
#
# What this does: super-resolves each image with Real-ESRGAN BEFORE the
# detector/judge loop (the VLM sees the high-res working image for small
# defects), then re-renders best_annotated.jpg on the ORIGINAL dims
# (detections JSON stays 0-1000). Grid line width/font and tile size
# auto-scale by the growth factor, so the red grid keeps its meaning.
#
# Requirements: a CUDA device + uv pip install -e .[esrgan]  (torch;
# CPU ESRGAN is refused at runtime). Weights auto-download to
# ~/.cache/llmog/esr on first use -- no manual step.
#
# Load with:
#   uv run llmog --task free_detection --config examples/esr_detection.example.yaml
# CLI flags override whatever you set here.
# ==============================================================================

task: free_detection

logging:
  level: INFO
  # file: null

inputs:
  images:
    - ./assets/image.png

classes:
  categories: "crack, scratch, dent"
  definitions: |
    crack: a thin linear fracture on the surface
    scratch: shallow groove from abrasion
    dent: a shallow depression or indentation

llm:
  detector_model: "local-model"
  judge_model: "local-model"
  max_rounds: 2
  score_threshold: 8
  detector_temperature: 0.9
  detector_top_p: 0.95
  judge_temperature: 0.2
  detector_max_tokens: 4096
  judge_max_tokens: 1024
  retries: 3

server:
  type: llama_cpp # "llama_cpp" | "vllm" | "external"
  url: "http://localhost:8080/v1"
  key: "not-needed"

output:
  folder: ./esr_detection_results
  no_plot: true

prep:
  enabled: true
  short_edge: 1024
  pad_square: false
  contrast_method: none
  gamma: 1.0
  denoise_method: none
  sharpen: false
  white_balance: false
  # Tiling for small objects (tile size auto-scales with ESR growth, so
  # relative coverage -- and cost -- stays as configured here).
  tiling_enabled: true
  tile_size: 512
  tile_overlap: 0.2
  crop_verify_enabled: false
  crop_padding: 0.15
  som_enabled: false
  # Grid overlay (step is 0-1000 relative and untouched; line width / font
  # auto-scale with ESR growth so the VLM sees the same relative grid).
  grid_style: standard
  grid_step: 100
  grid_line_width: 1
  grid_font_size: 0
  grid_line_color: "red"
  grid_text_color: "white"
  grid_backing_color: "black"

# --- Real-ESRGAN stage-0 (the point of this example) ---------------------------
# PRECEDENCE: these esr_* keys control only the INTERMEDIATE upscaled image.
# The final size the VLM sees always comes from the stages AFTER ESR
# (prep_short_edge / custom resize above). So ESR 2048 -> prep_short_edge
# 1024 means: super-resolve for detail, then fit to 1024 for the request.
# Set esr_target_long_edge to match (or sit just above) your final size to
# avoid upscaling pixels that get thrown away right after.
esr:
  enabled: true
  model: general-x4v3 # tiny/fast default; "x4plus" for max quality
  # model_path: null # explicit local checkpoint (wins over model)
  # model_repo: null # HF repo fallback (needs huggingface_hub), only if
  #   the official download fails
  # cache_dir: null # weight cache (default ~/.cache/llmog/esr)
  # scale: null # factor override (default: checkpoint native; mismatch = error)
  target_long_edge: 2048 # working size after ESR (0 = keep native x4 output)
  max_long_edge: 4096 # VRAM guard: larger ESR outputs are downscaled first
  tile_size: 512 # ESR inference tile (input px)
  overlap: 16 # ESR inference overlap (input px)
  # batch_size: 4 # ESR tiles per batch
  # compile: false # torch.compile (faster batches, slow first run)
  channels_last: true
  device: auto # first CUDA device ("cuda:0", ...); CPU is refused
