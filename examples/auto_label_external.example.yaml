# ==============================================================================
# Auto-label (YOLO relabeling) on an EXTERNAL OpenAI-compatible API
# Same fabric-defect task as auto_label_vllm.example.yaml, but talks to a
# hosted endpoint instead of spinning up a local vLLM server.
# Load with: uv run llmog --task auto_label --config examples/auto_label_external.example.yaml
# CLI flags override whatever you set here.
# ==============================================================================

# --- Task selection -----------------------------------------------------------
task: auto_label

# --- Logging ------------------------------------------------------------------
log_level: INFO
log_file: null

# --- Dataset (YOLO format) ----------------------------------------------------
train_image: ./ZJU-Leaper-8/train/images
train_label: ./ZJU-Leaper-8/train/labels
yaml_path: ./ZJU-Leaper-8/data.yaml
image_extensions: .jpg,.jpeg,.png
output_folder: ./output

# --- Classes & VLM Prompt Definitions -----------------------------------------
# --- Classes & VLM Prompt Definitions -----------------------------------------
categories: broken_end, hole, slub_knot, thin_bar, thick_bar, abrasion, stain, none
init_class_map: true

definitions: |
  broken_end: A narrow, discontinuous line running strictly VERTICAL (warp / machine direction) caused by a snapped warp yarn. Appears as an elongated vertical gap or a frayed break in a continuous vertical thread. Distinguish from thin_bar (which runs horizontally).
  hole: A physical puncture, tear, or void where fabric yarns are completely severed or missing, exposing the underlying background or dark void underneath. Distinguish from broken_end by having a 2D open cavity rather than a single 1D thread break.
  slub_knot: A localized, raised lump, knot, or tightly tangled clump of yarn fibers on the fabric surface (including neps, yarn snarls, and dense netting clusters). Noticeably thicker, denser, or protruding compared to the flat weave structure.
  thin_bar: A HORIZONTAL stripe or band running across the fabric width (weft direction) where yarn density is looser or filling yarns are missing, producing a visibly lighter, translucent, or sparse horizontal streak.
  thick_bar: A HORIZONTAL stripe or band running across the fabric width (weft direction) where filling yarns are crowded, double-picked, or denser than surrounding fabric, producing a visibly darker, raised horizontal streak.
  abrasion: A scuffed, rubbed, or fuzzy surface patch caused by mechanical friction. Surface fibers are fuzzed, roughened, or pilled into a matte, lighter texture patch, but the underlying yarn grid is still intact and no void/hole is present.
  stain: Any discolored, foreign, or contaminated patch on the fabric surface, including machine oil/grease spots, dirt residue, dye bleed, water marks, or rust marks. Appears as an irregular discolored zone without structural damage to the weave.
  none: Defect-free fabric. Uniform weave pattern, consistent thread spacing, no structural disruptions, and no foreign stains. Use this label whenever the crop shows clean, normal fabric.

class_mode: strict
preset: null

# Note: In most YOLO/VLM pipelines, confidence is [0.0 - 1.0].
# If your pipeline expects a float, change '2' to 0.20 or 0.25 to prevent dropping valid detections.
conf_threshold: 2

# --- Image resolution & None Handling -----------------------------------------
height: 1024
width: 1024

none_labels:
  - none
  - no_detection
  - nodetection
  - no_defect
  - background
  - unknown
  - negative
  - normal
drop_none: true # Strips background/none predictions from the final YOLO .txt files

# --- Sampling / Batching ------------------------------------------------------
num_samples: null
shuffle: false
seed: 42
start_index: null
end_index: null
batch_size: 40
dry_run: false

# --- Checkpointing & Resumption -----------------------------------------------
resume: true
auto_resume: true

# --- External API Configuration -----------------------------------------------
# server_type: external skips local server startup entirely (see
# auto_annotation/server_init.py: build_client) and talks directly to
# base_url with api_key. No local GPU, port, or health-check is used.
# All vLLM engine knobs from the vLLM example (max_model_len,
# gpu_memory_utilization, tensor_parallel_size, dtype, quantization,
# max_num_seqs, trust_remote_code, download_dir, chat_template,
# limit_mm_per_prompt, extra_args, ...) are intentionally omitted here:
# they are only consumed by the local server path and do nothing for external.
model: your-model-id # e.g. qwen/qwen2.5-vl-32b-instruct, gpt-4o-mini
server_type: external
api_key: sk-replace-me # replace, or override via CLI: --api_key $MY_KEY
base_url: https://your-endpoint/v1 # e.g. https://openrouter.ai/api/v1, https://api.openai.com/v1
max_workers:
  4 # lower than the vLLM example's 10; hosted endpoints enforce
  # RPM/TPM rate limits, so raise this only if your provider allows it.
  # On 429s, lower max_workers and/or batch_size and retry.
