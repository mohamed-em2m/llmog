# ==============================================================================
# Auto-label (YOLO relabeling) on an EXTERNAL OpenAI-compatible API
# Same fabric-defect task as auto_label_vllm.example.yaml, but talks to a
# hosted endpoint instead of spinning up a local vLLM server.
# Load with: uv run llmog --task auto_label --config examples/auto_label_external.example.yaml
# CLI flags override whatever you set here.
# ==============================================================================

task: auto_label

logging:
  level: INFO
  # file: null

inputs:
  train_image: ./ZJU-Leaper-8/train/images
  train_label: ./ZJU-Leaper-8/train/labels
  yaml_path: ./ZJU-Leaper-8/data.yaml
  image_extensions: .jpg,.jpeg,.png

output:
  folder: ./output

classes:
  categories: broken_end, hole, slub_knot, thin_bar, thick_bar, abrasion, stain, none
  init_class_map: true
  definitions: |
    broken_end: A narrow, discontinuous line running strictly VERTICAL (warp / machine direction) caused by a snapped warp yarn. Appears as an elongated vertical gap or a frayed break in a continuous vertical thread. Distinguish from thin_bar (which runs horizontally).
    hole: A physical puncture, tear, or void where fabric yarns are completely severed or missing, exposing the underlying background or dark void underneath. Distinguish from broken_end by having a 2D open cavity rather than a single 1D thread break.
    slub_knot: A localized, raised lump, knot, or tightly tangled clump of yarn fibers on the fabric surface (including neps, yarn snarls, and dense netting clusters). Noticeably thicker, denser, or protruding compared to the flat weave structure.
    thin_bar: A HORIZONTAL stripe or band running across the fabric width (weft direction) where yarn density is looser or filling yarns are missing, producing a visibly lighter, translucent, or sparse horizontal streak.
    thick_bar: A HORIZONTAL stripe or band running across the fabric width (weft direction) where filling yarns are crowded, double-picked, or denser than surrounding fabric, producing a visibly darker, raised horizontal streak.
    abrasion: A scuffed, rubbed, or fuzzy surface patch caused by mechanical friction. Surface fibers are fuzzed, roughened, or pilled into a matte, lighter texture patch, but the underlying yarn grid is still intact and no void/hole is present.
    stain: Any discolored, foreign, or contaminated patch on the fabric surface, including machine oil/grease spots, dirt residue, dye bleed, water marks, or rust marks. Appears as an irregular discolored zone without structural damage to the weave.
    none: Defect-free fabric. Uniform weave pattern, consistent thread spacing, no structural disruptions, and no foreign stains. Use this label whenever the crop shows clean, normal fabric.
  mode: strict # class_mode: "strict" | "hybrid" | "free"
  # preset: null
  # Note: confidence here is 1-5 (not 0.0-1.0). Boxes at/below this are ALSO
  # logged to *_low_confidence.json for manual review.
  conf_threshold: 2

sizing:
  height: 1024
  width: 1024

reclass:
  context: crop # recls_context: "crop" | "full_som"
  crop_padding_pct: 0
  resize_ratio: null # crop_resize_ratio
  min_box_size: 0
  small_box_action: keep # "keep" | "drop"
  drop_small_images: true
  none_labels:
    - none
    - no_detection
    - nodetection
    - no_defect
    - background
    - unknown
    - negative
    - normal
  drop_none: true # strips background/none predictions from final YOLO .txt files
  # Debug: save each box's exact final VLM-bound image (what the model sees,
  # letterbox included) as <stem>_box<line_no>.jpg under this dir (sync,
  # batch and dry runs). Output-only, no checkpoint effect.
  # dump_crops: null # dump_vlm_crops, e.g. ./output/vlm_crops

# --- Real-ESRGAN upscaling (opt-in) --------------------------------------
# ESR-THEN-CROP: with esr_enabled, the whole image is super-resolved ONCE
# and every box crop is cut from the upscaled pixels. Final YOLO coords
# always stay in original-image space. Needs: uv pip install -e .[esrgan]
# (torch, CUDA-only; CPU is refused). Weights auto-download on first use.
# PRECEDENCE: esr_* controls only the INTERMEDIATE image. The height/width
# above always wins for the final VLM payload, so match esr_target_long_edge
# to roughly max(height, width) -- larger just burns GPU for discarded pixels.
esr:
  enabled: false
  model: general-x4v3 # registry key (see esr/registry.py)
  # model_path: null # explicit local checkpoint (wins over model)
  target_long_edge: 2048 # working size after ESR (0 = keep native x4 output)
  max_long_edge: 4096 # VRAM guard: larger ESR outputs are downscaled first
  # Whole scenes upscale when esr_enabled is on. Per-crop ESR stays OFF unless
  # opted in (the pipeline upscales the whole image, never each crop, by default):
  # for_crops: true # opt-in for tiny-defect crops

sampling:
  num_samples: null
  shuffle: false
  seed: 42
  start: null # start_index
  end: null # end_index
  batch_size: 40
  dry_run: false

checkpoint:
  resume: true
  auto_resume: true

server:
  # server_type: external skips local server startup entirely (see
  # auto_annotation/server_init.py: build_client) and talks directly to
  # base_url with api_key. No local GPU, port, or health-check is used.
  # vLLM engine knobs are intentionally omitted here: they are only consumed
  # by the local server path and do nothing for external.
  type: external # server_type
  url: https://your-endpoint/v1 # base_url, e.g. https://openrouter.ai/api/v1
  key: sk-replace-me # api_key (or override via CLI: --api_key $MY_KEY)
  workers: 4 # max_workers: hosted endpoints enforce RPM/TPM rate limits --
    # lower than the vLLM example's 10; raise only if your provider allows it.
    # On 429s, lower max_workers and/or batch_size and retry.

llm:
  model: your-model-id # e.g. qwen/qwen2.5-vl-32b-instruct, gpt-4o-mini

# --- OpenAI Batch API (~50% cheaper than sync) ---------------------------------
# One /v1/chat/completions request per box is submitted as a batch job, then
# polled to completion and finalized into YOLO labels. Needs a provider with
# /v1/batches support -- the local llama.cpp / vLLM servers do not implement
# it, so keep server_type: external above.
# Jobs can take up to 24h. To split the work across sessions:
#   mode: submit -> uploads the job, writes <output>/.batch_job.json, exits
#   mode: poll   -> re-run with the same config later to finalize labels
#   mode: auto  -> submit + wait + finalize in one run (default)
batch:
  enabled: true # use_batch_api
  mode: auto # batch_mode: "auto" | "submit" | "poll"
  poll_interval: 60 # batch_poll_interval
  poll_timeout: 0 # batch_poll_timeout: 0 = wait forever; re-run with poll to resume
  window: 24h # batch_completion_window
  # job_id: null # batch_job_id: poll a specific provider batch id instead
  # submit_style controls how the requests reach the provider:
  #   file   -- upload batch_requests.jsonl and pass input_file_id (OpenAI).
  #   inline -- embed the requests in the create body and poll with raw HTTP.
  #             Use this for hosts whose /batches ignores input_file_id, e.g.
  #             OpenRouter (https://openrouter.ai/api/v1), which also returns
  #             results inline instead of via an output file.
  #   auto   -- try file, fall back to inline on that specific 400 (default).
  submit_style: auto # batch_submit_style
  # Inline hosts (e.g. OpenRouter) reject base64 images: with public_images,
  # crop JPEGs are uploaded to a public host and bodies rewritten to the URLs.
  # WARNING: uploads are world-readable; never use for sensitive data.
  # public_images: false # batch_public_images
  # host: catbox # image_host

# --- Provider-specific params (optional) --------------------------------------
# Forwarded verbatim as extra_body=... on every classify call. Omit (or leave
# commented) to send nothing extra. CLI equivalent:
#   --extra_body '{"provider": {"order": ["deepinfra"]}}'
# provider:
#   extra_body:
#     provider:
#       order: ["deepinfra"]
#       allow_fallbacks: false
