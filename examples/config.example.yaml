# ==============================================================================
# Example PipelineConfig for llmog (grouped sections).
# Every nested key maps to a PipelineConfig field in llmog/schemes/argument.py:
# uniform families strip their prefix (esr:, prep:, batch:), everything else
# is either verbatim or a documented short alias (see llmog/main.py).
# Load with: uv run llmog --task free_detection --config examples/config.example.yaml
# CLI flags override whatever you set here.
# ==============================================================================

task: free_detection # "free_detection" | "auto_label" | "classify"

logging:
  level: INFO
  # file: null # optional log file path

inputs:
  images:
    - ./assets/image.png

classes:
  categories: "person, car, bicycle, dog, cat"
  definitions: |
    crack: a thin linear fracture on the surface
    scratch: shallow groove from abrasion
    dent: a shallow depression or indentation

llm:
  detector_model: "local-model"
  judge_model: "local-model"
  # judge_url: null # separate base URL for the judge (defaults to base_url)
  max_rounds: 5
  score_threshold: 9
  detector_temperature: 0.7
  detector_top_p: 0.95
  judge_temperature: 0.2
  detector_max_tokens: 4096
  judge_max_tokens: 1024
  retries: 3 # api_retries

server:
  type: llama_cpp # "llama_cpp" | "vllm" | "external"
  url: "http://localhost:8080/v1" # base_url
  key: "not-needed" # api_key

output:
  folder: ./yaml_out # output_folder
  no_plot: true

prep:
  enabled: true
  short_edge: 1024
  pad_square: false
  contrast_method: clahe # "none" | "clahe" | "autocontrast"
  gamma: 1.0
  denoise_method: none # "none" | "bilateral" | "nlm"
  sharpen: false
  white_balance: false
  # Tiling for small objects
  tiling_enabled: true
  tile_size: 512
  tile_overlap: 0.25
  crop_verify_enabled: true
  crop_padding: 0.15
  # Set-of-Mark prompting
  som_enabled: false
  # Grid overlay
  grid_style: standard # "standard" | "transparent" | "fine" | "none"
  grid_step: 50
  grid_line_width: 1
  grid_font_size: 0 # 0 = auto
  grid_line_color: "blue"
  grid_text_color: "white"
  grid_backing_color: "black"
  # VLM processor pixel bounds (Qwen-VL / vLLM extra_body)
  send_pixel_bounds: true
  min_pixels: 200704
  max_pixels: 2097152

# --- Real-ESRGAN upscaling (opt-in) --------------------------------------
# Stage-0 super-resolution before resolution/grid/tiling: the VLM sees the
# high-res working image, final best_annotated.jpg is re-rendered on the
# ORIGINAL dims (detections JSON stays 0-1000). Grid line width/font and
# tile size auto-scale by the growth factor so relative measures hold.
# Needs: uv pip install -e .[esrgan] (torch, CUDA-only).
esr:
  enabled: false
  model: general-x4v3 # tiny/fast default; "x4plus" for max quality
  target_long_edge: 2048 # working size after ESR (0 = native x4 output)
  max_long_edge: 4096 # VRAM guard
  # model_path: null # explicit local checkpoint (wins over model)
  # compile: false # torch.compile (faster batches, slow first run)

# --- Serving extras (passed through to the server manager) --------------
serving_extra:
  ctx_size: 20000
  parallel_slots: 1
