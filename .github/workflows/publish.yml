name: Publish to PyPI

# Publishes on GitHub releases via OIDC trusted publishing (no API token).
# One-time setup on PyPI (https://pypi.org/project/llmog > Publishing):
# add a pending publisher for this repo + this workflow name, or the
# publish step will 403. The project builds with setuptools
# (see [build-system] in pyproject.toml).
on:
  release:
    types: [released]

jobs:
  publish-pypi:
    name: publish on pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llmog
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
