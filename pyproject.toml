[project]
name = "llmog"
version = "0.2.0"
description = "A pipeline for object detection using LLMs."
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "json-repair==0.61.0",
    "matplotlib==3.11.0",
    "openai==2.43.0",
    "pillow==12.2.0",
    "gradio==6.19.0",
    "requests>=2.34.2",
    "wrapt>=2.2.2",
    "httpx>=0.28.1",
    "numpy>=1.24.0",
    "streamlit>=1.58.0",
    "opencv-python>=4.9.0.80",
    "rich>=15.0.0",
    "onnxruntime>=1.27.0",
    "dynaprompt>=0.5.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
# Pick exactly ONE serving backend to install. See docs/install.md.
#
# llama-cpp-python: install the Python binding, whose "server" extra ships the
#   OpenAI-compatible server launched via `python -m llama_cpp.server`. The
#   plain PyPI sdist builds CPU-only by default; the [tool.uv.sources] /
#   [tool.uv.index] blocks below redirect this package to abetlen's prebuilt
#   CUDA wheel index instead, so `uv sync --extra llama-cpp-python` pulls a
#   GPU-enabled wheel with no local CUDA toolkit / nvcc / compiler needed.
# llama-cpp: install nothing extra at build time; requires the native
#   `llama-server` binary (build it with ./scripts/install_llama_cpp.sh).
llama-cpp-python = [
    "starlette",
    "uvicorn",
    "sse-starlette",
    "starlette-context",
    "llama-cpp-python[server]>=0.3.34",
    "pydantic_settings",
]
llama-cpp = []
vllm = ["vllm>=0.6.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocstrings-python>=1.11",
]


[project.scripts]
# Unified entry point: dispatch to free_detection or auto_annotation via --task
llmog = "main:main"
# Convenience aliases that pass the right --task for you
detection-cli = "free_detection:main"
auto-annotation = "auto_annotation:main"
# Launch the Gradio web interface (lives in the `interface` package)
detection-gui = "interface.gui:main"

[tool.setuptools]
package-dir = { "" = "llmog" }
py-modules = [
    "main",
    "auto_annotiontion",
] # NOTE: "auto_annotiontion" is an intentional typo-preservation — the shim keeps backward compat for code that still imports the old misspelled name. Do NOT rename it.

[tool.setuptools.packages.find]
where = ["llmog"]
include = [
    "free_detection*",
    "auto_annotation*",
    "schemes*",
    "servers*",
    "interface*",
    "detection_viewer*",
]
exclude = ["*.egg-info"]

[tool.uv]
package = true

# ─── llama-cpp-python CUDA wheels ─────────────────────────────────────────
# abetlen's project publishes prebuilt CUDA wheels on a separate index
# (they are NOT on PyPI). Pin the exact tag to the CUDA runtime you have
# installed on the machine that will *run* this (check with `nvidia-smi`
# for the driver's max supported CUDA version). Available tags as of this
# writing: cu118, cu121, cu122, cu123, cu124, cu125, cu130, cu132.
#
# Only cu121-cu125 reliably have wheels for Python 3.12; if you're on
# Python 3.13 (allowed by requires-python above) check that a matching
# cp313 wheel actually exists for your chosen tag before relying on this --
# otherwise uv will silently fall back to building from source, which
# needs the CUDA toolkit + nvcc + a C++ compiler on the build machine.
[[tool.uv.index]]
name = "llama-cpp-python-cuda"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"
explicit = true

[tool.uv.sources]
llama-cpp-python = [{ index = "llama-cpp-python-cuda" }]
